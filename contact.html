<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Cleaning Services in Sheffield</title>

    <meta name="description" content="Contact Sheffield Cleaning Services for professional home, office and deep cleaning services. Request a free quote today.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sheffield Cleaning Services</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="services.html">Services</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Contact Us</h2>

            <p>
                Get in touch with us to discuss your cleaning
                requirements or request a free quote.
            </p>
        </section>

        <section>

            <h2>Request a Free Quote</h2>

           <form id="contact-form">

                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="message">How can we help?</label>
                <textarea id="message" name="message" rows="6" required></textarea>

                <button type="submit">Send Enquiry</button>

            </form>
            <p id="form-message"></p>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Sheffield Cleaning Services</p>
    </footer>
    <script src="script.js"></script>

</body>

</html>
